name: Release

on:
  push:
    # The second pattern carries prerelease tags such as `v1.0.0-alpha.1`, which
    # publish as GitHub prereleases.
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # `REL-001`: one checksummed artifact per supported platform and architecture.
  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned tools
        uses: jdx/mise-action@v2
        with:
          version: 2026.8.6
          experimental: true

      # Each target is built once on its native runner.
      - run: mise run package ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/

  verify:
    name: verify artifact (${{ matrix.target }})
    needs: package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: dist

      - name: Install pinned tools
        uses: jdx/mise-action@v2
        with:
          version: 2026.8.6
          experimental: true

      # `TST-007`: verify the package job's exact native artifact. Supplying the
      # artifact directory guarantees release-check cannot rebuild it.
      - run: mise run release-check dist

  publish:
    name: publish
    needs: [package, verify]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Required reviewers on this protected environment record the manual human
    # qualification before any already-verified artifact is published.
    environment: release-publication
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: artifacts-*
          merge-multiple: false

      - name: Collect artifacts and merge checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          find incoming -name '*.tar.gz' -exec cp {} dist/ \;
          version="${GITHUB_REF_NAME#v}"
          cat incoming/*/contextveil-"${version}"-SHA256SUMS | sort -k2 > "dist/contextveil-${version}-SHA256SUMS"
          cd dist && sha256sum --check --status "contextveil-${version}-SHA256SUMS"
          ls -l

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          version="${GITHUB_REF_NAME#v}"
          bash scripts/release-notes.sh "${GITHUB_REF_NAME}" >"${notes}"
          if [ ! -s "${notes}" ]; then
            printf 'No changelog section found for %s\n' "${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          # A prerelease is published as one, and its notes say how to install it
          # given that the installer never selects a prerelease on its own
          # (`REL-002`).
          prerelease=()
          case "${version}" in
            *-*)
              prerelease=(--prerelease)
              {
                printf '\n## Install\n\n'
                printf 'The installer selects stable releases automatically. Install this prerelease by naming it:\n\n'
                printf '```bash\n'
                printf 'curl -fsSL https://raw.githubusercontent.com/daniel-sc/contextveil/v%s/install.sh | bash -s -- --version %s\n' \
                  "${version}" "${version}"
                printf '```\n'
              } >>"${notes}"
              ;;
            *)
              {
                printf '\n## Install\n\n'
                printf '```bash\n'
                printf 'curl -fsSL https://raw.githubusercontent.com/daniel-sc/contextveil/v%s/install.sh | bash\n' \
                  "${version}"
                printf '```\n'
              } >>"${notes}"
              ;;
          esac
          printf '\nSee the [README](https://github.com/daniel-sc/contextveil/tree/%s), [limitations](https://github.com/daniel-sc/contextveil/blob/%s/docs/limitations.md), and [qualification record](https://github.com/daniel-sc/contextveil/blob/%s/docs/qualification.md) for details.\n' \
            "${GITHUB_REF_NAME}" "${GITHUB_REF_NAME}" "${GITHUB_REF_NAME}" >>"${notes}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "ContextVeil ${version}" \
            --notes-file "${notes}" \
            "${prerelease[@]}" \
            dist/*
