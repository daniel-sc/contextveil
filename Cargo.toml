[package]
name = "secretsieve"
version = "1.0.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Keep enrolled local credentials out of coding-agent model context using deterministic exact-value redaction."
repository = "https://github.com/daniel-sc/secretsieve"
readme = "README.md"
keywords = ["secrets", "redaction", "coding-agent", "security"]
categories = ["command-line-utilities"]
publish = false

[features]
# Canary and secret-safe assertion helpers used by integration tests. They are
# never compiled into a release binary.
testing = []

[lib]
name = "secretsieve"
path = "src/lib.rs"

[[bin]]
name = "secretsieve"
path = "src/main.rs"

[[bin]]
name = "fuzz_smoke"
path = "src/bin/fuzz_smoke.rs"
required-features = ["testing"]

[[test]]
name = "claude_hook"
required-features = ["testing"]

[[test]]
name = "setup"
required-features = ["testing"]

[[test]]
name = "diagnose"
required-features = ["testing"]

[[test]]
name = "codex_hook"
required-features = ["testing"]

[[test]]
name = "copilot_hook"
required-features = ["testing"]

[[test]]
name = "leaks"
required-features = ["testing"]

[[test]]
name = "limits"
required-features = ["testing"]

[[test]]
name = "documentation"

[[bench]]
name = "redaction"
harness = false

[profile.release]
strip = "symbols"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.4"
